<!DOCTYPE html>
<!--
  ==========================================================================
  GLOBAL STOCKYARD LAYOUT & FLOW — standalone visual + interaction layer
  ==========================================================================
  Design prototype for integration into an existing Python/Streamlit planning
  application. Self-contained: no CDNs, no external fonts, no network calls.
  Contains NO backend, scheduling or planning logic.

  FILE STRUCTURE (single file, three clearly separated sections in <script>):
    1. LAYOUT      — static schematic geometry. Never changes at runtime.
    2. MOCK_DATA   — ALL mock operating data (piles / machines / routes /
                     processLines / destinations / hoppers / timeline).
                     Replace this object with real data from the host app.
    3. RENDERER    — builds the static SVG once, then applies state.

  INTEGRATION ENTRY POINT
    window.updateStockyardState(data)
      data: partial or full snapshot, shape identical to MOCK_DATA:
        {
          stateTime: "13 Jul 2026 · 14:00",
          piles:        [{ id, site, massT, capacityT, grades:[{grade,fraction}],
                           fillPct, repereFrom, repereTo, materialClass,
                           tsmEquivalentT, tsmLabel }],
          machines:     [{ id, type, railId, state, jobId, targetId,
                           positionRepere, rateTph, maximumRateTph }],
          routes:       [{ id, fromId, toId, state, flowTph, capacityTph }],
          processLines: [{ id, state, residenceMinutes }],
          destinations: [{ id, lifecycleState, requestedGrade, demandT,
                           plannedDeliveryT }],
          hoppers:      [{ id, state, rateTph, maximumRateTph, feedsId }]
        }
      Arrays are merged BY id, so partial updates are allowed:
        window.updateStockyardState({ machines: [{ id: 'M16-ST-A', state: 'Idle' }] });
      The static layout (SVG nodes, geometry, rails, labels) is never rebuilt;
      only inventory, grades, states, jobs, flows, positions, destination
      lifecycle and hover/selection content are refreshed.

    window.getStockyardState()  -> current merged snapshot (read-only copy)

  STABLE IDENTIFIERS
    Every physical element carries data-asset-id (= the id used in the data
    object) and data-asset-kind (pile | machine | rail | route | hopper |
    processLine | corridor | destination). Query e.g.
      document.querySelector('[data-asset-id="HP-01"]')

  VALID STATES
    machines / hoppers / routes : Running, Stacking, Reclaiming, Travelling,
                                  Idle, Maintenance, Unavailable, Future
    processLines / destinations : Available, Future, Disabled
  ==========================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Global Stockyard Layout &amp; Flow — handoff prototype</title>
<style>
  :root {
    --ink: #2f353b;
    --navy: #1f3a5f;
    --mute: #98a0a7;
    --line: #d7dbde;
    --sans: ui-sans-serif, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f4f5f6; color: var(--ink); font-family: var(--sans); }
  a { color: var(--navy); }
  a:hover { color: #2b5f9e; }
  #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ---------- toolbar ---------- */
  #toolbar {
    flex: 0 0 auto; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center;
    gap: 10px 18px; padding: 7px 18px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .tb-group { display: flex; align-items: center; gap: 6px; }
  .tb-group + .tb-group { border-left: 1px solid #e3e6e8; padding-left: 18px; }
  .tb-cap { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .brand { font-size: 14px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--navy); }
  .brand-sub { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  button, select {
    font-family: var(--sans); font-size: 11px; color: var(--ink);
    border: 1px solid var(--line); background: #fff; border-radius: 3px; cursor: pointer;
  }
  button:disabled, select:disabled { opacity: 1; cursor: default; }
  .btn { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 6px 12px; white-space: nowrap; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.on { background: #eaeef2; border-color: var(--navy); color: var(--navy); }
  .btn.tab { padding: 5px 10px; }
  .btn.tab.on { background: #eaeef2; border-color: var(--navy); color: var(--navy); }
  .step { width: 22px; height: 22px; padding: 0; color: #5f686f; font-size: 12px; }
  select { padding: 4px 6px; }
  .chip {
    font-family: var(--mono); font-size: 10px; padding: 4px 7px 4px 5px; border-radius: 3px;
    display: flex; align-items: center; gap: 5px; background: #f4f6f7; border-color: #b9c1c7;
  }
  .chip.off { background: #fff; border-color: #e3e6e8; color: #a7aeb4; opacity: .6; }
  .chip i { width: 9px; height: 9px; border-radius: 1px; display: block; }
  .zoom { font-family: var(--mono); font-size: 11px; color: var(--mute); }
  .spacer { margin-left: auto; }
  #timeLabel { font-family: var(--mono); font-size: 12px; }
  #planningSummary { display: none; align-items: center; gap: 6px; }
  .resource-summary {
    display: inline-flex; align-items: center; gap: 5px; min-height: 28px;
    padding: 4px 8px; border: 1px solid #cfd5d9; border-radius: 4px;
    background: #f7f8f9; color: #55616b; white-space: nowrap;
    font-family: var(--mono); font-size: 10px; font-weight: 650;
  }
  .resource-summary i { width: 9px; height: 9px; border-radius: 50%; }
  .resource-summary.warn { border-color: #d5a04a; background: #fff8e8; }
  .resource-summary.bad { border-color: #c46b6b; background: #fdf0f0; }

  /* Routing configuration is the exact Monitor drawing with a quieter
     presentation. State-bearing resources stay dominant; inventory detail
     remains available through hover and selection. */
  body.routing-availability #timeGroup,
  body.routing-availability #gradeGroup,
  body.routing-availability #equipmentGroup,
  body.routing-availability #pap2Group { display: none; }
  body.routing-availability #planningSummary { display: flex; }
  body.routing-availability #toolbar { min-height: 48px; gap: 8px 14px; }
  body.routing-availability .routing-detail-label { display: none; }
  body.routing-availability .hint b { color: var(--navy); }

  /* ---------- stage ---------- */
  #stage {
    position: relative; flex: 1 1 auto; overflow: hidden; cursor: grab; background: #f4f5f6;
    background-image: radial-gradient(#dfe3e6 1px, transparent 1px); background-size: 28px 28px;
  }
  #stage.dragging { cursor: grabbing; }
  #svg { position: absolute; inset: 0; display: block; }
  #svg text { user-select: none; pointer-events: none; }

  .hint {
    position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 10px;
    padding: 6px 11px; background: rgba(255,255,255,.92); border: 1px solid #dfe3e6; border-radius: 4px;
    font-size: 10px; color: #b3bac0; z-index: 3;
  }
  .hint b { font-family: var(--mono); font-weight: 400; letter-spacing: .04em; color: #6c757c; }

  /* ---------- hover card ---------- */
  #hoverCard {
    position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; display: none;
    min-width: 190px; max-width: 290px; background: #fff; border: 1px solid #c7ccd1;
    border-left: 4px solid var(--navy); border-radius: 4px; padding: 9px 11px 10px;
    box-shadow: 0 8px 22px rgba(31,40,48,.16);
  }
  #hoverCard .hc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  #hoverCard .hc-id { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--navy); }
  #hoverCard .hc-kind { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
  .kv .k { font-size: 11px; color: #8a9199; }
  .kv .v { font-family: var(--mono); font-size: 11px; text-align: right; }

  /* ---------- details panel ---------- */
  #details {
    position: absolute; right: 14px; top: 14px; bottom: 14px; width: 306px; display: none;
    flex-direction: column; background: #fff; border: 1px solid #d0d5d9; border-radius: 5px;
    box-shadow: 0 10px 30px rgba(31,40,48,.12); z-index: 6;
  }
  #details.open { display: flex; }
  .dp-head { padding: 13px 15px 11px; border-bottom: 1px solid #e6e9eb; display: flex; align-items: flex-start; gap: 10px; }
  .dp-kind { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }
  .dp-id { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--navy); }
  .dp-close { width: 24px; height: 24px; color: #6c757c; font-size: 13px; }
  .dp-state { padding: 12px 15px; border-bottom: 1px solid #e6e9eb; display: flex; align-items: center; gap: 8px; }
  .dp-state i { width: 11px; height: 11px; border-radius: 50%; }
  .dp-state b { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .dp-state span { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--mute); }
  .dp-body { flex: 1 1 auto; overflow: auto; padding: 4px 15px 14px; }
  .dp-body .kv { grid-template-columns: auto 1fr; gap: 0 14px; align-items: baseline; }
  .dp-body .kv .k, .dp-body .kv .v { font-size: 11.5px; padding: 7px 0; border-bottom: 1px solid #f0f2f3; }
  .dp-sub { margin: 15px 0 8px; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tags span { font-family: var(--mono); font-size: 10px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 3px; background: #f7f8f9; color: #4e565d; }

  /* ---------- legend ---------- */
  #legend {
    position: absolute; left: 14px; bottom: 14px; width: 470px; display: none; z-index: 4;
    background: #fff; border: 1px solid #d0d5d9; border-radius: 5px; padding: 13px 15px 14px;
    box-shadow: 0 10px 26px rgba(31,40,48,.12);
  }
  #legend.open { display: block; }
  .lg-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px; }
  .lg-head b { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--navy); }
  .lg-head span { font-size: 10px; color: var(--mute); }
  .lg-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
  .lg-cap { font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: var(--mute); margin-bottom: 7px; }
  .lg-items { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; }
  .lg-item { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #4e565d; }
  .lg-item .sw { width: 13px; height: 11px; border-radius: 1px; border: 1px solid rgba(0,0,0,.18); }
  .lg-item .lamp { width: 13px; height: 13px; border-radius: 50%; color: #fff; font-family: var(--mono);
    font-size: 8px; display: flex; align-items: center; justify-content: center; }
  .lg-item code { font-family: var(--mono); font-size: 10px; }
  .lg-sym { grid-column: 1 / -1; border-top: 1px solid #eef0f1; padding-top: 11px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="tb-group">
      <span class="brand">Global Stockyard</span>
      <span class="brand-sub">Layout &amp; Flow</span>
    </div>
    <div class="tb-group">
      <span class="tb-cap">Site</span>
      <div id="siteTabs" style="display:flex;gap:4px"></div>
    </div>
    <div class="tb-group" id="timeGroup">
      <span class="tb-cap">State time</span>
      <span id="timeLabel">—</span>
      <button class="step" id="timeBack" disabled aria-disabled="true"
              title="Select the state time in the planning application">&#8249;</button>
      <button class="step" id="timeFwd" disabled aria-disabled="true"
              title="Select the state time in the planning application">&#8250;</button>
    </div>
    <div class="tb-group" id="gradeGroup">
      <span class="tb-cap">Grade</span>
      <div id="gradeChips" style="display:flex;gap:4px"></div>
    </div>
    <div class="tb-group" id="equipmentGroup">
      <span class="tb-cap">Equipment</span>
      <select id="stateFilter"></select>
    </div>
    <div class="tb-group" id="pap2Group">
      <span class="tb-cap">PAP-2</span>
      <select id="pap2State" disabled aria-disabled="true"
              aria-label="PAP-2 lifecycle, read only"
              title="Configured in Scenario planning">
        <option>Available</option><option>Future</option><option>Disabled</option>
      </select>
    </div>
    <div class="tb-group" id="planningSummary" aria-label="Planning resource availability summary"></div>
    <div class="tb-group spacer" style="border-left:0;padding-left:0">
      <span class="zoom" id="zoomLabel">100%</span>
      <button class="btn primary" id="fitBtn">Fit view</button>
      <button class="btn" id="legendBtn">Legend</button>
    </div>
  </div>

  <div id="stage">
    <svg id="svg" width="100%" height="100%"><g id="world"></g></svg>

    <div id="hoverCard">
      <div class="hc-head"><span class="hc-id"></span><span class="hc-kind"></span></div>
      <div class="kv"></div>
    </div>

    <div id="details">
      <div class="dp-head">
        <div style="flex:1 1 auto">
          <div class="dp-kind"></div>
          <div class="dp-id"></div>
        </div>
        <button class="dp-close" id="detailsClose">&#215;</button>
      </div>
      <div class="dp-state"><i></i><b></b><span></span></div>
      <div class="dp-body">
        <div class="kv"></div>
        <div class="dp-sub">Connected path</div>
        <div class="tags"></div>
      </div>
    </div>

    <div id="legend"></div>

    <div class="hint"><b>SCHEMATIC · NOT TO SCALE</b><span>wheel zoom · drag pan · double-click fit</span></div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   0. SHARED VOCABULARY (presentation constants — not operating data)
   ========================================================================= */
var NAVY = '#1f3a5f', MUTE = '#98a0a7';
var FONT_SANS = 'ui-sans-serif, "Helvetica Neue", Helvetica, Arial, sans-serif';
var FONT_MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';

var GRADE_COLOR = {
  'HIGH-CD': '#8e4a63', 'LOW-CD': '#c1592c',
  'TBT': '#1c6b73', 'BT': '#3f7fa6', 'MT': '#6b4fa8', 'LT': '#f0b429'
};
/* state -> [colour, single-character code]. Colour is never the only carrier. */
var STATE = {
  Running: ['#2f7d4f', 'R'], Stacking: ['#2f7d4f', 'S'], Reclaiming: ['#2f7d4f', 'C'],
  Travelling: ['#2b5f9e', 'T'], Idle: ['#8a9099', 'I'], Maintenance: ['#c08a1e', 'M'],
  Unavailable: ['#a83232', 'U'], Future: ['#6b4fa8', 'F'],
  Available: ['#2f7d4f', 'A'], Partial: ['#b7791f', 'P'],
  Reference: ['#8a9099', 'R'], Disabled: ['#9aa1a7', 'D']
};
var KIND_LABEL = {
  pile: 'Stockpile', machine: 'Machine', rail: 'Machine rail', route: 'Conveyor route',
  hopper: 'Mine hopper', processLine: 'Process line', destination: 'Destination',
  corridor: 'Corridor interface'
};

/* =========================================================================
   1. LAYOUT — static schematic geometry (world units). Read-only at runtime.
      PH  = stockpile footprint height
      RUP = stacker-rail offset above a pile row
      RDN = reclaimer-rail offset below a pile row
   ========================================================================= */
var PH = 56, RUP = 40, RDN = 44;

var LAYOUT = {
  world: { w: 2800, h: 1620 },

  sites: [
    { id: 'LOUTA',     label: 'LOUTA',     sub: 'MINE HOPPERS 2 · WASHING LINES 2', x: 40,   y: 40,  w: 1450, h: 545 },
    { id: 'BENGUERIR', label: 'BENGUERIR', sub: 'MINE HOPPERS 3 · WASHING LINES 3', x: 40,   y: 750, w: 1450, h: 830 },
    { id: 'MPH',       label: 'MPH M16',   sub: '4 BAYS · 8 STOCKPILES',            x: 1780, y: 40,  w: 600,  h: 1340 }
  ],

  groups: [
    { id: 'L-MS',  site: 'LOUTA',     label: 'MINE STORAGE',    x: 150,  w: 340 },
    { id: 'L-RAW', site: 'LOUTA',     label: 'RAW MATERIAL',    x: 515,  w: 340 },
    { id: 'L-WP',  site: 'LOUTA',     label: 'WASHED PRODUCT',  x: 1115, w: 310 },
    { id: 'B-MS',  site: 'BENGUERIR', label: 'MINE ORE',        x: 150,  w: 370 },
    { id: 'B-RAW', site: 'BENGUERIR', label: 'RAW MATERIAL',    x: 545,  w: 330 },
    { id: 'B-WP',  site: 'BENGUERIR', label: 'WASHED PRODUCT',  x: 1135, w: 330 },
    { id: 'M-B1',  site: 'MPH',       label: 'BAY 1',           x: 1845, w: 460 },
    { id: 'M-B2',  site: 'MPH',       label: 'BAY 2',           x: 1845, w: 460 },
    { id: 'M-B3',  site: 'MPH',       label: 'BAY 3',           x: 1845, w: 460 },
    { id: 'M-B4',  site: 'MPH',       label: 'BAY 4',           x: 1845, w: 460 }
  ],

  /* Each row = one machine line pair (stacker rail above, reclaimer rail below)
     plus the stockpile footprints those machines serve. */
  rows: [
    { id: 'R-L-MS-1',  group: 'L-MS',  y: 170,  stackerRail: 'RL-L-MS-1',  reclaimerRail: 'RC-L-MS-1',  stacker: '102MG-ST-01',  reclaimer: '110MG-RC-01', piles: [{ id: '102MG-SP-01', x: 165,  w: 310 }] },
    { id: 'R-L-MS-2',  group: 'L-MS',  y: 430,  stackerRail: 'RL-L-MS-2',  reclaimerRail: 'RC-L-MS-2',  stacker: '102MG-ST-02',  reclaimer: '110MG-RC-02', piles: [{ id: '102MG-SP-02', x: 165,  w: 310 }] },
    { id: 'R-L-RAW-1', group: 'L-RAW', y: 170,  stackerRail: 'RL-L-RAW-1', reclaimerRail: 'RC-L-RAW-1', stacker: '110LG-ST-01',  reclaimer: '120LG-RC-01', piles: [{ id: '110LG-OL1',   x: 530,  w: 310 }] },
    { id: 'R-L-RAW-2', group: 'L-RAW', y: 430,  stackerRail: 'RL-L-RAW-2', reclaimerRail: 'RC-L-RAW-2', stacker: '110LG-ST-02',  reclaimer: '120LG-RC-02', piles: [{ id: '110LG-OL2',   x: 530,  w: 310 }] },
    { id: 'R-L-WP-1',  group: 'L-WP',  y: 170,  stackerRail: 'RL-L-WP-1',  reclaimerRail: 'RC-L-WP-1',  stacker: '130LG-ST-01',  reclaimer: '140LG-RC-01', piles: [{ id: 'LT-P1',       x: 1120, w: 300 }] },
    { id: 'R-L-WP-2',  group: 'L-WP',  y: 430,  stackerRail: 'RL-L-WP-2',  reclaimerRail: 'RC-L-WP-2',  stacker: '130LG-ST-02',  reclaimer: '140LG-RC-02', piles: [{ id: 'LT-P2',       x: 1120, w: 300 }] },

    { id: 'R-B-MS-1',  group: 'B-MS',  y: 900,  stackerRail: 'RL-B-MS-1',  reclaimerRail: 'RC-B-MS-1',  stacker: 'BG-MINE-ST-1', reclaimer: 'BG-MINE-RC-1', piles: [{ id: 'BG-MINE-P1', x: 165,  w: 340 }] },
    { id: 'R-B-MS-2',  group: 'B-MS',  y: 1140, stackerRail: 'RL-B-MS-2',  reclaimerRail: 'RC-B-MS-2',  stacker: 'BG-MINE-ST-2', reclaimer: 'BG-MINE-RC-2', piles: [{ id: 'BG-MINE-P2', x: 165,  w: 340 }] },
    { id: 'R-B-RAW-1', group: 'B-RAW', y: 900,  stackerRail: 'RL-B-RAW-1', reclaimerRail: 'RC-B-RAW-1', stacker: 'BG-RAW-ST-1',  reclaimer: 'BG-RAW-RC-1',  piles: [{ id: 'BG-RAW-P1',  x: 560,  w: 300 }] },
    { id: 'R-B-RAW-2', group: 'B-RAW', y: 1140, stackerRail: 'RL-B-RAW-2', reclaimerRail: 'RC-B-RAW-2', stacker: 'BG-RAW-ST-2',  reclaimer: 'BG-RAW-RC-2',  piles: [{ id: 'BG-RAW-P2',  x: 560,  w: 300 }] },
    { id: 'R-B-WP-1',  group: 'B-WP',  y: 1220, stackerRail: 'RL-B-WP-1',  reclaimerRail: 'RC-B-WP-1',  stacker: 'BG-ST-3',      reclaimer: 'BG-RC-2',      piles: [{ id: 'BG-P1',      x: 1150, w: 300 }] },
    { id: 'R-B-WP-2',  group: 'B-WP',  y: 1420, stackerRail: 'RL-B-WP-2',  reclaimerRail: 'RC-B-WP-2',  stacker: 'BG-ST-4',      reclaimer: 'BG-RC-3',      piles: [{ id: 'BG-P2',      x: 1150, w: 300 }] },

    { id: 'R-M-B1',    group: 'M-B1',  y: 180,  stackerRail: 'RL-M-B1',    reclaimerRail: 'RC-M-B1',    stacker: 'M16-ST-A',     reclaimer: 'M16-RC-A',     piles: [{ id: 'HP-01', x: 1860, w: 200 }, { id: 'HP-05', x: 2090, w: 200 }] },
    { id: 'R-M-B2',    group: 'M-B2',  y: 520,  stackerRail: 'RL-M-B2',    reclaimerRail: 'RC-M-B2',    stacker: 'M16-ST-B',     reclaimer: 'M16-RC-B',     piles: [{ id: 'HP-02', x: 1860, w: 200 }, { id: 'HP-06', x: 2090, w: 200 }] },
    { id: 'R-M-B3',    group: 'M-B3',  y: 860,  stackerRail: 'RL-M-B3',    reclaimerRail: 'RC-M-B3',    stacker: 'M16-ST-C',     reclaimer: 'M16-RC-C',     piles: [{ id: 'HP-03', x: 1860, w: 200 }, { id: 'HP-07', x: 2090, w: 200 }] },
    { id: 'R-M-B4',    group: 'M-B4',  y: 1200, stackerRail: 'RL-M-B4',    reclaimerRail: 'RC-M-B4',    stacker: 'M16-ST-D',     reclaimer: 'M16-RC-D',     piles: [{ id: 'HP-04', x: 1860, w: 200 }, { id: 'HP-08', x: 2090, w: 200 }] }
  ],

  hoppers: [
    { id: 'LO-HOP-1', x: 90, y: 170 }, { id: 'LO-HOP-2', x: 90, y: 430 },
    { id: 'BG-HOP-1', x: 90, y: 900 }, { id: 'BG-HOP-2', x: 90, y: 1020 }, { id: 'BG-HOP-3', x: 90, y: 1140 }

function neighbours(kind, id) {
  var out = [];
  var push = function (k, i) { if (i) out.push(k + ':' + i); };
  var assetKind = function (aid) {
    if (byId(DATA.piles, aid)) return 'pile';
    if (byId(DATA.machines, aid)) return 'machine';

    if (byId(DATA.destinations, aid)) return 'destination';
    if (byId(DATA.hoppers, aid)) return 'hopper';
    if (byId(LAYOUT.corridors, aid)) return 'corridor';
    return null;
  };
  if (kind === 'pile') {
    var r = rowOfPile(id);
    if (r) { push('machine', r.stacker); push('machine', r.reclaimer); push('rail', r.stackerRail); push('rail', r.reclaimerRail); }
    DATA.routes.forEach(function (rt) { if (rt.toId === id || rt.fromId === id || (r && (rt.toId === r.stacker || rt.fromId === r.reclaimer))) push('route', rt.id); });
  } else if (kind === 'machine') {
    var m = byId(DATA.machines, id), rr = m ? rowOfRail(m.railId) : null;
    if (rr) { rr.piles.forEach(function (p) { push('pile', p.id); }); push('rail', m.railId); }
    DATA.routes.forEach(function (rt) { if (rt.toId === id || rt.fromId === id) push('route', rt.id); });
  } else if (kind === 'rail') {
    var r2 = rowOfRail(id);
    if (r2) { r2.piles.forEach(function (p) { push('pile', p.id); }); push('machine', railGeom(id).kind === 'Stacker' ? r2.stacker : r2.reclaimer); }
  } else if (kind === 'route') {
    var rt2 = byId(DATA.routes, id);
    if (rt2) [rt2.fromId, rt2.toId].forEach(function (n) { var k = assetKind(n); if (k) push(k, n); });
  } else if (kind === 'processLine') {

  } else if (kind === 'destination' || kind === 'corridor') {
    DATA.routes.forEach(function (rt) { if (rt.toId === id || rt.fromId === id) { push('route', rt.id); var k = assetKind(rt.fromId); if (k) push(k, rt.fromId); } });

function connectedSet(sel) {
  if (!sel) return { set: {}, path: [] };
  var set = {}, path = [];
  var occurrences = [sel.id], selected = assetData(sel.kind, sel.id);
  if (selected && selected.canonicalId && (sel.kind === 'machine' || sel.kind === 'pile')) {
    var collection = sel.kind === 'machine' ? DATA.machines : DATA.piles;
    collection.forEach(function (item) {
      if (item.canonicalId === selected.canonicalId && occurrences.indexOf(item.id) < 0) occurrences.push(item.id);
    });
  }
  occurrences.forEach(function (occurrence) {
    set[sel.kind + ':' + occurrence] = 1;
    neighbours(sel.kind, occurrence).forEach(function (key) {
      if (!set[key]) {
        set[key] = 1;
        var id = key.split(':').slice(1).join(':');
        if (path.indexOf(id) < 0) path.push(id);
      }
    });
  });
  return { set: set, path: path };
}

    var on = hl('pile', p.id);

    ref.shell.setAttribute('stroke-width', on ? 3 : 1.8);

    if (p.blendLocation) {

      var blendColour = /COMPLETE|DEPLETED/.test(blendStatus) ? '#2f7d4f'
        : /BUILDING|PLANNED|PROPOSED/.test(blendStatus) ? '#b96d17'
        : blendStatus.indexOf('ENABLED') >= 0 ? NAVY : '#788188';
      ref.blendBadgeRect.setAttribute('fill', blendColour);
    }
    /* The shell is engineering capacity. Coloured length is physical inventory.
       Repere bounds locate the usable pile zone; they must never make a partly
       filled pile look full. */
    var spaceStart = p.repereFrom != null
      ? Math.max(0, Math.min(1, Number(p.repereFrom) / 1000)) : 0;
    var spaceEnd = p.repereTo != null
      ? Math.max(spaceStart, Math.min(1, Number(p.repereTo) / 1000)) : 1;
    var pct = p.fillPct != null ? Number(p.fillPct) : 100 * p.massT / p.capacityT;
    var occupiedFraction = Math.max(0, Math.min(1, pct / 100));
    var occupiedStart = ref.x + ref.w * spaceStart;
    var occupiedWidth = ref.w * (spaceEnd - spaceStart) * occupiedFraction;
    var fx = occupiedStart + occupiedWidth;
    ref.mark.setAttribute('x1', fx); ref.mark.setAttribute('x2', fx);
    ref.mark.setAttribute('opacity', p.massT > 0 ? 1 : 0);

    }, 0);
    var cursorShare = 0;
    p.grades.forEach(function (b, bandIndex) {
      var rawShare = b.inventoryShare != null ? Number(b.inventoryShare) : Number(b.fraction || 0);
      var share = shareTotal > 0 ? Math.max(0, rawShare) / shareTotal : 0;
      var startShare = cursorShare;
      cursorShare += share;
      var endShare = bandIndex === p.grades.length - 1 ? 1 : cursorShare;
      var bx = occupiedStart + occupiedWidth * startShare;

      if (bw <= 0) return;
      var gOn = gradeOn(b.grade), inset = 5;

function stateOf(kind, id) {

  if (kind === 'route') { var r = byId(DATA.routes, id); return r ? (DATA.planningMode && r.baselineState ? planningStateTitle(r) : r.state) : 'Idle'; }
  if (kind === 'processLine') { var l = byId(DATA.processLines, id); return l ? (DATA.planningMode && l.baselineState ? planningStateTitle(l) : l.state) : 'Available'; }
  if (kind === 'destination') { var d = byId(DATA.destinations, id); return d ? (DATA.planningMode && d.baselineState ? planningStateTitle(d) : d.lifecycleState) : 'Available'; }
  if (kind === 'hopper') { var h = byId(DATA.hoppers, id); return h ? h.state : 'Idle'; }

function esc(value) {

}

/* ---------- 3e. view: zoom / pan / fit ---------- */
function bboxFor(siteId) {
  if (!siteId) return { x: 20, y: 20, w: LAYOUT.world.w - 20, h: LAYOUT.world.h - 20 };
  var s = byId(LAYOUT.sites, siteId), pad = 60;
  return { x: s.x - pad, y: s.y - pad, w: s.w + (siteId === 'MPH' ? 420 : 320), h: s.h + pad * 2 };
}
function fitTo(siteId) {
  var r = stage.getBoundingClientRect(), b = bboxFor(siteId);
  var k = Math.min(r.width / b.w, r.height / b.h) * .96;
  VIEW = { k: k, x: (r.width - b.w * k) / 2 - b.x * k, y: (r.height - b.h * k) / 2 - b.y * k };
  applyView();
}
function applyView() {
  world.setAttribute('transform', 'translate(' + VIEW.x + ',' + VIEW.y + ') scale(' + VIEW.k + ')');
  document.getElementById('zoomLabel').textContent = Math.round(VIEW.k * 100) + '%';
}
stage.addEventListener('wheel', function (e) {
  e.preventDefault();
  var r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  var k = Math.max(.14, Math.min(3, VIEW.k * Math.exp(-e.deltaY * .0016)));
  VIEW = { k: k, x: mx - (mx - VIEW.x) * (k / VIEW.k), y: my - (my - VIEW.y) * (k / VIEW.k) };
  applyView();
}, { passive: false });

var moved = false;
stage.addEventListener('mousedown', function (e) {
  var sx = e.clientX, sy = e.clientY, v = { x: VIEW.x, y: VIEW.y, k: VIEW.k };
  moved = false;
  function mv(ev) {
    if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 3) { moved = true; UI.dragging = true; stage.classList.add('dragging'); hideHover(); }
    VIEW = { k: v.k, x: v.x + ev.clientX - sx, y: v.y + ev.clientY - sy };
    applyView();
  }
  function up() { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); UI.dragging = false; stage.classList.remove('dragging'); }
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
});
function assetAt(e) {
  var n = e.target.closest ? e.target.closest('[data-asset-id]') : null;
  if (!n) return null;
  var kind = n.getAttribute('data-asset-kind');
  if (kind === 'site') return null;
  return { kind: kind, id: n.getAttribute('data-asset-id') };
}
stage.addEventListener('mousemove', function (e) {
  if (UI.dragging) return;
  var a = assetAt(e);
  if (!a) { hideHover(); UI.hover = null; return; }
  var r = stage.getBoundingClientRect();
  UI.hover = a;
  showHover(a.kind, a.id, e.clientX - r.left, e.clientY - r.top);
});
stage.addEventListener('mouseleave', hideHover);
stage.addEventListener('click', function (e) {
  if (moved) return;
  UI.sel = assetAt(e);
  applyState();
});
stage.addEventListener('dblclick', function () { fitTo(null); });
document.getElementById('detailsClose').onclick = function () { UI.sel = null; applyState(); };

/* ---------- 3f. toolbar ---------- */
function uniquePlanningResources(items) {
  var seen = {}, out = [];
  (items || []).forEach(function (item) {
    if (!item || item.configurable === false) return;
    var key = item.canonicalId || item.id;
    if (!key || seen[key]) return;
    seen[key] = 1; out.push(item);
  });
  return out;
}
function resourceSummary(label, items) {
  items = uniquePlanningResources(items);
  var available = items.filter(function (item) { return baselineState(item) === 'AVAILABLE'; }).length;
  var severe = items.some(function (item) {
    var state = baselineState(item);
    return state === 'UNAVAILABLE' || state === 'MAINTENANCE';
  });
  var warning = items.some(function (item) { return baselineState(item) !== 'AVAILABLE'; });
  var timed = items.filter(function (item) { return Number(item.timedChangeCount || 0) > 0; }).length;
  var cls = severe ? ' bad' : warning ? ' warn' : '';
  var color = severe ? STATE.Unavailable[0] : warning ? STATE.Partial[0] : STATE.Available[0];
  var timedText = timed ? ' / ' + timed + ' timed' : '';
  return '<span class="resource-summary' + cls + '"><i style="background:' + color + '"></i>' +
    label + ' ' + available + '/' + items.length + ' available' + timedText + '</span>';
}
function buildPlanningSummary() {
  if (!ROUTING_VIEW) return;
  var plants = (DATA.processLines || []).concat(DATA.destinations || []);
  document.getElementById('planningSummary').innerHTML =
    resourceSummary('Machines', DATA.machines) +
    resourceSummary('Conveyors', DATA.routes) +
    resourceSummary('Plants', plants);
}
(function buildToolbar() {
  var tabs = [{ id: null, label: 'All' }, { id: 'LOUTA', label: 'Louta' }, { id: 'BENGUERIR', label: 'Benguerir' }, { id: 'MPH', label: 'MPH M16' }];
  var host = document.getElementById('siteTabs');
  var initialSite = DATA.initialSite || null;
  tabs.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'btn tab' + (t.id === initialSite ? ' on' : '');
    b.textContent = t.label;
    b.onclick = function () {
      host.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      fitTo(t.id);
    };
    host.appendChild(b);
  });

  var chips = document.getElementById('gradeChips');
  Object.keys(GRADE_COLOR).forEach(function (g) {
    var b = document.createElement('button');
    b.className = 'chip' + (UI.grades.indexOf(g) >= 0 ? '' : ' off');
    b.innerHTML = '<i style="background:' + GRADE_COLOR[g] + '"></i>' + g;
    b.onclick = function () {
      var i = UI.grades.indexOf(g);
      if (i >= 0) { UI.grades.splice(i, 1); b.classList.add('off'); } else { UI.grades.push(g); b.classList.remove('off'); }
      applyState();
    };
    chips.appendChild(b);
  });

  var sel = document.getElementById('stateFilter');
  ['All states', 'Running', 'Stacking', 'Reclaiming', 'Travelling', 'Idle', 'Maintenance', 'Unavailable', 'Future'].forEach(function (s) {
    var o = document.createElement('option'); o.textContent = s; sel.appendChild(o);
  });
  sel.onchange = function () { UI.stateFilter = sel.value; applyState(); };

  document.getElementById('fitBtn').onclick = function () { fitTo(null); };
  var lb = document.getElementById('legendBtn');
  lb.onclick = function () { UI.legend = !UI.legend; lb.classList.toggle('on', UI.legend); document.getElementById('legend').classList.toggle('open', UI.legend); };

  buildPlanningSummary();

})();

/* ---------- 3g. legend ---------- */
(function buildLegend() {
  var g = Object.keys(GRADE_COLOR).map(function (k) {
    return '<div class="lg-item"><span class="sw" style="background:' + GRADE_COLOR[k] + '"></span><code>' + k + '</code></div>';
  }).join('');
  var states = ['Running', 'Stacking', 'Reclaiming', 'Travelling', 'Idle', 'Maintenance', 'Unavailable', 'Future'].map(function (k) {
    return '<div class="lg-item"><span class="lamp" style="background:' + STATE[k][0] + '">' + STATE[k][1] + '</span>' + k + '</div>';
  }).join('');
  var sym = [
    ['Stockpile footprint', '<rect x="1" y="3" width="24" height="10" fill="#fdfdfd" stroke="#6b747b" stroke-width="1.4"/>'],
    ['Machine rail', '<line x1="1" y1="8" x2="25" y2="8" stroke="#7c858c" stroke-width="2.4"/><path d="M1 4V12M25 4V12" stroke="#7c858c" stroke-width="1.6"/>'],
    ['Stacker / reclaimer', '<rect x="4" y="5" width="16" height="8" rx="1.5" fill="#d6dbdf" stroke="#4e565d"/><circle cx="21" cy="5" r="3.4" fill="#2f7d4f"/>'],
    ['Conveyor (running)', '<line x1="1" y1="8" x2="25" y2="8" stroke="#aab1b7" stroke-width="6"/><line x1="1" y1="8" x2="25" y2="8" stroke="#2f7d4f" stroke-width="2.4"/>'],
    ['Idle conveyor', '<line x1="1" y1="8" x2="25" y2="8" stroke="#aab1b7" stroke-width="6"/><line x1="1" y1="8" x2="25" y2="8" stroke="#9aa1a7" stroke-width="2.4" stroke-dasharray="2 4"/>'],
    ['Future asset (dashed)', '<rect x="1" y="3" width="24" height="10" fill="#eeeaf6" stroke="#6b4fa8" stroke-width="1.4" stroke-dasharray="4 3"/>'],
    ['Mine hopper', '<path d="M2 3H24L17 13H9Z" fill="#d6dbdf" stroke="#4e565d" stroke-width="1.4"/>'],
    ['Corridor C1 / C2', '<path d="M1 12H13V4H25" fill="none" stroke="#aab1b7" stroke-width="6"/><path d="M1 12H13V4H25" fill="none" stroke="#2f7d4f" stroke-width="2.4"/>']
  ].map(function (s) {
    return '<div class="lg-item"><svg width="26" height="16">' + s[1] + '</svg>' + s[0] + '</div>';
  }).join('');
  document.getElementById('legend').innerHTML =
    '<div class="lg-head"><b>Legend</b><span>colour never carries state alone · text or pattern always paired</span></div>' +
    '<div class="lg-cols">' +
      '<div><div class="lg-cap">Material grade</div><div class="lg-items">' + g + '</div></div>' +
      '<div><div class="lg-cap">Equipment state (lamp + code)</div><div class="lg-items">' + states + '</div></div>' +
      '<div class="lg-sym">' + sym + '</div>' +
    '</div>';
})();

/* =========================================================================
   PUBLIC API
   ========================================================================= */
/**
 * Merge an operating-state snapshot into the view and repaint.
 * Static layout is untouched; arrays are merged by id, so partial patches work.
 * @param {Object} data see file header for the accepted shape
 */
window.updateStockyardState = function (data) {
  if (!data) { applyState(); return DATA; }
  if (data.stateTime) DATA.stateTime = data.stateTime;
  ['piles', 'machines', 'routes', 'processLines', 'destinations', 'hoppers'].forEach(function (coll) {
    (data[coll] || []).forEach(function (incoming) {
      var target = byId(DATA[coll], incoming.id);
      if (!target) { DATA[coll].push(clone(incoming)); return; }
      for (var k in incoming) if (k !== 'id') target[k] = clone({ v: incoming[k] }).v;
      if (coll === 'piles' && incoming.massT != null && incoming.fillPct == null)
        target.fillPct = Math.round(target.massT / target.capacityT * 100);
    });
  });
  applyState();
  buildPlanningSummary();
  return DATA;
};
/** @returns {Object} read-only copy of the current merged snapshot */
window.getStockyardState = function () { return clone(DATA); };

/* =========================================================================
   BOOT
   ========================================================================= */
buildStaticLayout();
applyState();
fitTo(DATA.initialSite || null);
window.addEventListener('resize', function () { fitTo(null); });
</script>
